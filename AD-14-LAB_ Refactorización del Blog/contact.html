
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contáctanos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="container text-center py-3">
    <h1>Contáctanos</h1>
  </header>


<nav class="navbar navbar-dark bg-primary">
  <div class="container justify-content-center">
    <ul class="navbar-nav flex-row align-items-center justify-content-center gap-4">
      <li class="nav-item">
        <a class="nav-link active" href="index.html">Inicio</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="about.html">Acerca de nosotros</a>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="contact.html">Contáctanos</a>
      </li>

      <li class="nav-item">
        <button
          type="button"
          id="themeToggle"
          class="btn btn-outline-light btn-sm"
          aria-pressed="false"
        >
          🌙 Modo oscuro
        </button>
      </li>
    </ul>
  </div>
</nav>



<main class="container my-4">
  <div class="row">

    <!-- Columna izquierda reservada -->
    <aside class="col-12 col-md-2">
    </aside>

    <!-- Formulario de contacto -->
    <section class="col-12 col-md-8">
      <h2 class="text-center mb-4">Contáctanos</h2>

      <form id="contactForm">
        <div class="mb-3">
          <label for="email" class="form-label">
            Correo electrónico
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="nombre@ejemplo.com"
            required
          >
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Mensaje</label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            rows="4"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
          Enviar mensaje
        </button>
      </form>

      <div
        id="messageAlert"
        class="alert alert-success alert-dismissible fade show mt-3 d-none"
        role="alert"
      >
        Mensaje enviado
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Cerrar"
        ></button>
      </div>
    </section>

    <!-- Columna derecha reservada -->
    <aside class="col-12 col-md-2">
    </aside>

  </div>
</main>


  <footer class="container-fluid bg-dark text-white text-center py-3">
    <p>Blog de prueba generation</p>
    <p class="mb-0">
      Contacto:
      <a href="mailto:equipo@example.com" class="text-white">Jesus Peralta 555555</a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
