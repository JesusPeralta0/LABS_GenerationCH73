
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <title>Uso de Componentes Bootstrap</title>
  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index2.html">index2</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Botón de alerta -->
  <button type="button" class="btn btn-primary" id="botonAlerta">
    El Botón
  </button>

  <div id="contenedorAlerta"></div>

  <!-- Diseño con cuadrícula Bootstrap -->
  <div class="container d-flex flex-column">

    <div class="row">
      <div class="col-2 border p-3 text-center">
        el lado izquierdo
      </div>

      <div class="col-8 border p-3 text-center">
        el lado central
      </div>

      <div class="col-2 border p-3 text-center">
        el lado derecho
      </div>
    </div>

    <div class="row">
      <div class="col-12 border p-3 text-center">
        Pie de página
      </div>
    </div>

  </div>

  <!-- Formulario -->
  <form>
    <div class="mb-3">
      <label for="correo" class="form-label">
        Correo electrónico
      </label>
      <input
        type="email"
        class="form-control"
        id="correo"
        placeholder="nombre@ejemplo.com">
    </div>

    <div class="mb-3">
      <label for="mensaje" class="form-label">
        Mensaje
      </label>
      <textarea
        class="form-control"
        id="mensaje"
        rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Enviar
    </button>
  </form>

  <!-- JavaScript de Bootstrap y del proyecto -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
